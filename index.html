function buildNav(u){if(u.photoURL){$("av").src=u.photoURL;$("av").classList.remove("hide")}$("nav").innerHTML=`<h2><span class="logo sm">${ic("layers")}</span><span>Qayıdış<small>Admin</small></span></h2>`+T.map(([k,l,i])=>`<a data-k="${k}">${ic(i)}<span>${l}</span></a>`).join("")+`<div class="me">${esc(u.email)}</div>`;$("nav").onclick=e=>{const k=e.target.closest("a")?.dataset.k;if(k)location.hash="#"+k}}

function route(){unsub&&unsub();unsub=null;const k=(location.hash||"#library_books").slice(1);const t=T.find(x=>x[0]===k)||T[0];
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===t[0]));$("ttl").textContent=t[1];
  const v=$("view");v.innerHTML="";({questions:qView,push:pushView}[t[0]]||crud)(v)}

// ---------- Fayl yükləmə (Storage) ----------
function upload(file,folder,cb){return new Promise((res,rej)=>{const n=file.name.replace(/[^\w.\-]/g,"_");const t=S.uploadBytesResumable(S.ref(st,`${folder}/${Date.now()}_${n}`),file);
  t.on("state_changed",s=>cb(Math.round(100*s.bytesTransferred/s.totalBytes)),rej,async()=>res(await S.getDownloadURL(t.snapshot.ref)))})}

// ---------- Kolleksiya CRUD ----------
const ID={k:"id",l:"Sənəd ID",h:"boş = avtomatik",id:1};
const dua=[ID,{k:"title",l:"Başlıq",r:1},{k:"arabic",l:"Ərəbcə mətn",a:1,rtl:1},{k:"oxunus",l:"Oxunuş",a:1},{k:"tercume",l:"Tərcümə",a:1},{k:"audioUrl",l:"Səs (link / yüklə)",f:"audio/*",d:"audio"},{k:"order",l:"Sıra",n:1}];
const CFG={
 library_books:{sort:"order",dir:"desc",t:"title",s:["author"],img:"coverUrl",ic:"book",ts:"addedAt",f:[ID,{k:"title",l:"Kitabın adı",r:1},{k:"author",l:"Müəllif"},{k:"coverUrl",l:"Üz qabığı (link / yüklə)",f:"image/*",d:"covers"},{k:"pdfUrl",l:"PDF (link / yüklə)",f:"application/pdf",d:"pdfs"},{k:"order",l:"Sıra",h:"böyük = daha yeni",n:1},{k:"addedAt",l:"Əlavə tarixi",h:"boş = indi",dt:1},{k:"ratingSum",l:"Reytinq cəmi",n:1,z:1},{k:"ratingCount",l:"Reytinq sayı",n:1,z:1}]},
 duas:{sort:"order",dir:"asc",t:"title",s:[],ic:"feather",f:dua},
 hadiths:{sort:"order",dir:"asc",t:"text",s:["source","author"],ic:"quote",f:[ID,{k:"text",l:"Hədis mətni",a:1,r:1},{k:"source",l:"Mənbə"},{k:"author",l:"Müəllif / rəvayətçi"},{k:"order",l:"Sıra",n:1}]}};
const loc=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const dval=v=>v?.toDate?loc(v.toDate()):(typeof v==="number"?loc(new Date(v)):"");
async function crud(v){const name=(location.hash||"#library_books").slice(1),C=CFG[name];let rows=[];
  v.innerHTML=`<div class="bar"><div class="sb">${ic("search")}<input id="s" placeholder="Axtar..."></div><button class="btn" id="add">${ic("plus")}Əlavə et</button><button class="btn g" id="imp">${ic("upload")}JSON import</button></div><div id="t"></div>`;
  const draw=()=>{const q=$("s").value.toLowerCase();const r=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
    $("t").innerHTML=r.map(x=>`<div class="it"><div class="th">${x[C.img]?`<img loading="lazy" src="${esc(x[C.img])}" alt="">`:ic(C.ic)}</div><div class="tx"><b>${esc(x[C.t])}</b><small><span class="tag">#${esc(x.order??"–")}</span>${esc(C.s.map(k=>x[k]).filter(Boolean).join(" · "))}</small></div><div class="act"><button class="btn g s" data-e="${x.id}" title="Düzəlt">${ic("edit")}</button><button class="btn g s" data-d="${x.id}" title="Sil">${ic("trash")}</button></div></div>`).join("")||"<p>Boşdur</p>"};
  const load=async()=>{try{const s=await getDocs(query(collection(db,name),orderBy(C.sort,C.dir)));rows=s.docs.map(d=>({id:d.id,...d.data()}));draw()}catch(e){$("t").innerHTML=`<div class="err">Yüklənmədi: ${esc(e.message)}</div>`}};
  $("s").oninput=draw;$("add").onclick=()=>form(null);
  $("t").onclick=async e=>{const b=e.target;if(b.dataset.e)form(rows.find(x=>x.id===b.dataset.e));if(b.dataset.d&&await ask("Silinsin? Geri qaytarılmır.")){await deleteDoc(doc(db,name,b.dataset.d));toast("Silindi");load()}};
  $("imp").onclick=()=>{const d=modal(`<h3>JSON import</h3><p style="color:var(--mut);font-size:13px">Massiv yapışdırın: <code>[{"title":"..."}]</code>. İxtiyari "id" sahəsi sənəd ID-si olur. Sıra yoxdursa avtomatik artır. Mümkün sahələr: ${C.f.filter(f=>!f.id).map(f=>f.k).join(", ")}</p><textarea id="ij" style="min-height:240px;font-family:monospace;font-size:12px"></textarea><div class="foot"><button class="btn g" id="c">Ləğv</button><button class="btn" id="ok">İmport et</button></div>`);
    d.querySelector("#c").onclick=close;d.querySelector("#ok").onclick=async()=>{try{const arr=JSON.parse(d.querySelector("#ij").value);if(!Array.isArray(arr))throw Error("Massiv deyil");let n=Math.max(0,...rows.map(r=>+r.order||0)),b=writeBatch(db),c=0;
      for(const it of arr){const o={};for(const f of C.f)if(!f.id&&it[f.k]!==undefined)o[f.k]=f.dt?(typeof it[f.k]==="number"?Timestamp.fromMillis(it[f.k]):Timestamp.fromDate(new Date(it[f.k]))):it[f.k];
        if(o.order===undefined)o.order=++n;if(C.ts&&!o[C.ts])o[C.ts]=serverTimestamp();b.set(it.id?doc(db,name,String(it.id)):doc(collection(db,name)),o);if(++c%400===0){await b.commit();b=writeBatch(db)}}
      await b.commit();close();toast(c+" sənəd əlavə olundu");load()}catch(e){toast("Xəta: "+e.message)}}};
  function form(x){const nx=Math.max(0,...rows.map(r=>+r.order||0))+1;
    const d=modal(`<h3>${x?"Düzəliş":"Yeni"}</h3>`+C.f.map(f=>{const val=f.id?(x?x.id:""):f.dt?dval(x?.[f.k]):(x?x[f.k]:(f.k==="order"?nx:(f.z?0:"")));
      const inp=f.a?`<textarea data-k="${f.k}" ${f.rtl?'dir="rtl"':""}>${esc(val)}</textarea>`:`<input data-k="${f.k}" type="${f.n?"number":f.dt?"datetime-local":"text"}" ${f.id&&x?"disabled":""} value="${esc(val)}">`;
      return `<label>${f.l}${f.r?" *":""} ${f.h?`<small>(${f.h})</small>`:""}</label>`+(f.f?`<div class="row">${inp}<button class="btn g s" data-u="${f.k}">Yüklə</button></div><input type="file" accept="${f.f}" class="hide" data-fk="${f.k}">`:inp)}).join("")+`<div class="foot"><button class="btn g" id="c">Ləğv</button><button class="btn" id="ok">Yadda saxla</button></div>`);
    d.querySelector("#c").onclick=close;
    d.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>d.querySelector(`[data-fk="${b.dataset.u}"]`).click());
    d.querySelectorAll("[data-fk]").forEach(fi=>fi.onchange=async()=>{const f=C.f.find(z=>z.k===fi.dataset.fk),b=d.querySelector(`[data-u="${f.k}"]`);if(!fi.files[0])return;b.disabled=true;try{d.querySelector(`[data-k="${f.k}"]`).value=await upload(fi.files[0],`${name}/${f.d}`,p=>b.textContent=p+"%");toast("Yükləndi")}catch(e){toast("Yüklənmədi: "+e.code)}b.disabled=false;b.textContent="Yüklə"});
    d.querySelector("#ok").onclick=async()=>{const o={};let nid="";for(const f of C.f){const v=d.querySelector(`[data-k="${f.k}"]`).value.trim();if(f.id){nid=v;continue}if(f.r&&!v)return toast(f.l+" boşdur");
      if(f.n)o[f.k]=+v||0;else if(f.dt){if(v)o[f.k]=Timestamp.fromDate(new Date(v));else if(!x)o[f.k]=serverTimestamp()}else o[f.k]=v}
      try{if(x)await updateDoc(doc(db,name,x.id),o);else if(nid){if((await getDoc(doc(db,name,nid))).exists())return toast("Bu ID artıq var");await setDoc(doc(db,name,nid),o)}else await addDoc(collection(db,name),o);close();toast("Yadda saxlandı");load()}catch(e){toast("Xəta: "+e.code)}}}
  load()}

// ---------- Suallar: WhatsApp tipli söhbət ----------
async function fcm(message){const t=await getTok();const r=await fetch(`https://fcm.googleapis.com/v1/projects/${cfg.projectId}/messages:send`,{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({message})});const j=await r.json();if(!r.ok)throw new Error((j.error?.status||r.status)+": "+(j.error?.message||""))}
function qView(v){
  v.innerHTML=`<div class="chat" id="ch"><aside><div class="cs"><div class="sb">${ic("search")}<input id="qs" placeholder="Axtar..."></div></div><div id="cls"></div></aside><section><div class="ph" id="ph">${ic("chat","big")}<br>Söhbət seçin</div><div id="cw" class="hide"><div class="ch"><button class="btn g s bk" id="bk">${ic("back")}</button><div class="av" id="hav"></div><div class="tx"><b id="hn"></b><br><small id="hs" style="color:var(--mut)"></small></div><button class="btn g s" id="dc" title="Söhbəti sil">${ic("trash")}</button></div><div id="ms"></div><div id="eb" class="hide"><span id="ebt"></span><button class="btn g s" id="ce">${ic("x")}</button></div><div class="cmp"><label class="pk" title="Bildiriş də göndər"><input type="checkbox" id="pu">${ic("bell")}</label><textarea id="in" rows="1" placeholder="Mesaj yaz..."></textarea><button class="btn" id="sd">${ic("send")}</button></div></div></section></div>`;
  let docs=[],act=null,edit=null,convs=new Map,fresh=false;
  const lbl=id=>"İstifadəçi #"+id.slice(-4),tm=t=>new Date(t).toLocaleTimeString("az",{hour:"2-digit",minute:"2-digit"}),dy=t=>new Date(t).toLocaleDateString("az");
  const lt=t=>dy(t)===dy(Date.now())?tm(t):dy(t);
  function build(){convs=new Map;for(const d of docs){const id=d.deviceId||"?";let c=convs.get(id);if(!c)convs.set(id,c={id,items:[],token:""});if(!c.token&&d.fcmToken&&!d.fromAdmin)c.token=d.fcmToken;const ct=d.createdAtMillis||0,at=(d.answerText||"").trim();
    if(!d.fromAdmin&&((d.questionText||"").trim()||d.imageId))c.items.push({k:"q",id:d.id,text:d.questionText||"",img:d.imageId,t:ct,ed:d.editedAtMillis!=null});
    if(at||(d.fromAdmin&&d.imageId))c.items.push({k:"a",id:d.id,text:d.answerText||"",img:d.fromAdmin?d.imageId:null,t:d.answeredAtMillis||ct,fa:!!d.fromAdmin,ed:d.fromAdmin?d.editedAtMillis!=null:d.answerEditedAtMillis!=null})}
    for(const c of convs.values()){c.items.sort((a,b)=>a.t-b.t||(a.k==="q"?-1:1));c.last=c.items[c.items.length-1]}}
  function drawList(){const q=$("qs").value.toLowerCase();
    $("cls").innerHTML=[...convs.values()].filter(c=>c.last&&(!q||lbl(c.id).toLowerCase().includes(q)||c.items.some(i=>i.text.toLowerCase().includes(q)))).sort((a,b)=>b.last.t-a.last.t).map(c=>`<div class="cv ${c.id===act?"on":""}" data-c="${esc(c.id)}"><div class="av">${esc(c.id.slice(-2).toUpperCase())}</div><div class="tx"><div class="r"><b>${lbl(c.id)}</b><small>${lt(c.last.t)}</small></div><div class="r"><small class="ln">${c.last.k==="a"?ic("check","tk"):""}${esc(c.last.text||"Şəkil")}</small>${c.last.k==="q"?'<i class="bd"></i>':""}</div></div></div>`).join("")||`<p style="padding:16px;color:var(--mut)">Söhbət yoxdur</p>`}
  function drawMsgs(){const c=convs.get(act);if(!c)return;const box=$("ms"),near=box.scrollHeight-box.scrollTop-box.clientHeight<140;let h="",pd="";
    for(const m of c.items){const d=dy(m.t);if(d!==pd){h+=`<div class="dl">${d}</div>`;pd=d}
      h+=`<div class="m ${m.k==="a"?"mine":""}"><div class="bb">${m.img?`<button class="btn g s" data-img="${m.img}">${ic("image")}Şəkli aç</button>`:""}${m.text?`<div>${esc(m.text)}</div>`:""}<div class="mt">${m.ed?"düzəliş edilib · ":""}${tm(m.t)}</div></div><button class="mb" data-m="${m.k}|${m.id}">${ic("more")}</button></div>`}
    box.innerHTML=h;if(near||fresh)box.scrollTop=box.scrollHeight;fresh=false;$("hn").textContent=lbl(act);$("hav").textContent=act.slice(-2).toUpperCase();$("hs").textContent=c.items.length+" mesaj"}
  function open(id){act=id;cancel();fresh=true;$("ph").classList.add("hide");$("cw").classList.remove("hide");$("ch").classList.add("open");drawList();drawMsgs();$("in").focus()}
  function closeC(){act=null;cancel();$("cw").classList.add("hide");$("ph").classList.remove("hide");$("ch").classList.remove("open");drawList()}
  function cancel(){edit=null;$("eb").classList.add("hide");$("in").value="";grow()}
  const grow=()=>{const i=$("in");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,140)+"px"};
  $("in").oninput=grow;$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
  $("sd").onclick=send;$("ce").onclick=cancel;$("bk").onclick=closeC;$("qs").oninput=drawList;
  $("cls").onclick=e=>{const c=e.target.closest("[data-c]");if(c)open(c.dataset.c)};
  $("dc").onclick=async()=>{if(!await ask("Bütün söhbət silinsin? Geri qaytarılmır."))return;try{let b=writeBatch(db),n=0;for(const d of docs.filter(d=>(d.deviceId||"?")===act)){b.delete(doc(db,"questions",d.id));if(++n%400===0){await b.commit();b=writeBatch(db)}}await b.commit();toast("Söhbət silindi")}catch(e){toast("Silinmədi: "+e.code)}};
  async function send(){const text=$("in").value.trim(),c=convs.get(act);if(!text||!c)return;const now=Date.now();$("sd").disabled=true;
    try{if(edit){const m=edit;await updateDoc(doc(db,"questions",m.id),m.k==="q"?{questionText:text,editedAtMillis:now}:m.fa?{answerText:text,editedAtMillis:now}:{answerText:text,answerEditedAtMillis:now});cancel()}
      else{if(c.last?.k==="q")await updateDoc(doc(db,"questions",c.last.id),{answerText:text,answeredAtMillis:now});
        else await addDoc(collection(db,"questions"),{fromAdmin:true,deviceId:act,userName:"Admin",questionText:"",answerText:text,imageId:null,createdAt:serverTimestamp(),createdAtMillis:now,answeredAtMillis:now});
        $("in").value="";grow();fresh=true;
        if($("pu").checked){if(!c.token)toast("Bu istifadəçinin push tokeni yoxdur");else try{await fcm({token:c.token,notification:{title:"Qayıdış",body:text},data:{route:"question"}})}catch(e){toast("Push göndərilmədi: "+e.message)}}}}
    catch(e){toast("Göndərilmədi: "+(e.code||e.message))}$("sd").disabled=false;$("in").focus()}
  $("ms").onclick=async e=>{const b=e.target,c=convs.get(act);
    if(b.dataset.img){const s=await getDoc(doc(db,"chat_images",b.dataset.img));if(s.exists())b.outerHTML=`<img style="max-width:240px;border-radius:12px;display:block;margin-bottom:6px" src="data:${esc(s.data().mime)};base64,${s.data().b64}">`}
    if(b.dataset.m){const [k,id]=b.dataset.m.split("|"),m=c.items.find(i=>i.k===k&&i.id===id);
      const d=modal(`<h3>Mesaj</h3><button class="btn g mi" id="me">${ic("edit")}Redaktə et</button><button class="btn g mi" id="mc">${ic("copy")}Kopyala</button><button class="btn d mi" id="md">${ic("trash")}Sil</button><div class="foot"><button class="btn g" id="mx">Bağla</button></div>`);
      d.querySelector("#mx").onclick=close;
      d.querySelector("#mc").onclick=()=>{navigator.clipboard?.writeText(m.text);close();toast("Kopyalandı")};
      d.querySelector("#me").onclick=()=>{close();edit=m;$("ebt").textContent="Redaktə: "+m.text.slice(0,60);$("eb").classList.remove("hide");$("in").value=m.text;grow();$("in").focus()};
      d.querySelector("#md").onclick=async()=>{close();if(!await ask(m.k==="q"?"Bu sual (cavabı ilə birlikdə) silinsin?":"Bu mesaj silinsin?"))return;try{if(m.k==="a"&&!m.fa)await updateDoc(doc(db,"questions",m.id),{answerText:null,answeredAtMillis:null});else await deleteDoc(doc(db,"questions",m.id));toast("Silindi")}catch(e){toast("Silinmədi: "+e.code)}}}};
  unsub=onSnapshot(query(collection(db,"questions"),orderBy("createdAtMillis","desc"),limit(600)),s=>{docs=s.docs.map(d=>({id:d.id,...d.data()}));build();drawList();if(act){if(convs.has(act))drawMsgs();else closeC()}},e=>toast("Yüklənmədi: "+(e.code||e.message)))}

// ---------- Push bildiriş (FCM HTTP v1, Google hesabınızın tokeni ilə) ----------
const ROUTES=[["","Keçidsiz"],["home","Ana səhifə"],["support","Dəstək"],["discover","Kəşf"],["question","Sual-cavab"],["settings","Ayarlar"],["quran","Quran"],["dua","Dua"],["sahife","Səhifeyi-Səccadiyyə"],["mefatih","Məfatihül-Cinan"],["hadis","Hədis"],["namaz","Namaz"],["teqvim","Təqvim"],["kitabxana","Kitabxana"],["tesbeh","Təsbeh"],["qeza","Qəza"],["qible","Qiblə"],["notifications","Bildirişlər"],["faq","FAQ"],["update","Play Store yeniləmə"],["surah:36","Sürə (nömrə dəyişin)"],["ayah:2:255","Ayə (sürə:ayə)"],["custom","Xarici link / özəl..."]];
async function getTok(){if(tok&&Date.now()-tokAt<3000000)return tok;const r=await A.reauthenticateWithPopup(auth.currentUser,prov());tok=A.GoogleAuthProvider.credentialFromResult(r).accessToken;tokAt=Date.now();keep();return tok}
function pushView(v){v.innerHTML=`<div class="grid"><div class="card"><label style="margin-top:0">Hədəf</label><select id="tg"><option value="topic:all_users">Bütün istifadəçilər</option><option value="topic">Başqa mövzu (topic)</option><option value="token">Konkret cihaz (FCM token)</option></select><input id="tv" class="hide" placeholder="topic adı və ya token" style="margin-top:8px">
  <label>Başlıq *</label><input id="pt"><label>Mətn *</label><textarea id="pb"></textarea><label>Şəkil linki</label><div class="row"><input id="pi" placeholder="https://..."><button class="btn g s" id="pu">Yüklə</button></div><input type="file" id="pf" accept="image/*" class="hide">
  <label>Toxunanda açılsın</label><select id="pr">${ROUTES.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("")}</select><input id="pc" style="margin-top:8px" placeholder="Marşrut / link (surah:36, ayah:2:255, https://...)">
  <div class="foot"><button class="btn" id="send">${ic("send")}Göndər</button></div><div class="err" id="pe"></div></div>
  <div><div class="pv"><b id="vt">Başlıq</b><div id="vb" style="color:var(--mut)">Mətn</div><img id="vi" class="hide"></div><p style="color:var(--mut);font-size:13px">Bildiriş FCM ilə birbaşa Google hesabınızın icazəsi ilə göndərilir. Hesab layihədə Owner/Editor olmalıdır; Google Cloud-da "Firebase Cloud Messaging API" aktiv olmalıdır.</p></div></div>`;
  const g=id=>$(id),sync=()=>{g("vt").textContent=g("pt").value||"Başlıq";g("vb").textContent=g("pb").value||"Mətn";const i=g("pi").value.trim();g("vi").classList.toggle("hide",!i);g("vi").src=i};
  ["pt","pb","pi"].forEach(i=>g(i).oninput=sync);
  g("tg").onchange=()=>g("tv").classList.toggle("hide",g("tg").value==="topic:all_users");
  g("pr").onchange=()=>{const x=g("pr").value;g("pc").value=x==="custom"?"":x};
  g("pu").onclick=()=>g("pf").click();g("pf").onchange=async()=>{try{g("pi").value=await upload(g("pf").files[0],"notifications",p=>g("pu").textContent=p+"%");sync();toast("Yükləndi")}catch(e){toast("Yüklənmədi")}g("pu").textContent="Yüklə"};
  g("send").onclick=async()=>{g("pe").textContent="";const title=g("pt").value.trim(),body=g("pb").value.trim();if(!title||!body)return toast("Başlıq və mətn lazımdır");
    const tg=g("tg").value,tv=g("tv").value.trim(),route=g("pc").value.trim(),img=g("pi").value.trim();let target;
    if(tg==="topic:all_users")target={topic:"all_users"};else if(!tv)return toast("Hədəfi yazın");else target=tg==="topic"?{topic:tv}:{token:tv};
    if(!await ask(tg==="topic:all_users"?"Bildiriş BÜTÜN istifadəçilərə göndərilsin?":"Bildiriş göndərilsin?"))return;
    const data={};if(route)data.route=route;if(img)data.imageUrl=img;
    try{const t=await getTok();const r=await fetch(`https://fcm.googleapis.com/v1/projects/${cfg.projectId}/messages:send`,{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({message:{...target,notification:{title,body,...(img?{image:img}:{})},data,android:{priority:"HIGH"}}})});
      const j=await r.json();if(!r.ok)throw new Error((j.error?.status||r.status)+": "+(j.error?.message||""));toast("Göndərildi")}
    catch(e){g("pe").textContent="Göndərilmədi — "+e.message+"\n(403: hesabın icazəsi / FCM API aktiv deyil; 401: yenidən giriş edin)"}}}

</script>
